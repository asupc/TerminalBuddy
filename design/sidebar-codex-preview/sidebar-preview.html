<style>
#tb-sidebar-preview{--tb-bg:#202123;--tb-fg:#e5e6e8;--tb-muted:#a6a8ad;--tb-accent:#7db4f2;--tb-row:38px;color-scheme:dark;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--tb-fg);width:100%}
#tb-sidebar-preview *{box-sizing:border-box}
#tb-sidebar-preview button,#tb-sidebar-preview input{font:inherit;color:inherit}
#tb-sidebar-preview button{cursor:pointer}
#tb-sidebar-preview button:focus-visible,#tb-sidebar-preview input:focus-visible{outline:2px solid var(--tb-accent);outline-offset:2px}
#tb-sidebar-preview i,#tb-sidebar-preview svg{width:16px;height:16px;flex-shrink:0;stroke-width:1.6}
#tb-sidebar-preview .tb-window{border:1px solid #303236;border-radius:12px;overflow:hidden;background:#1f1f1f}
#tb-sidebar-preview .tb-top{height:42px;display:flex;align-items:center;gap:10px;padding:0 15px;background:#202225;border-bottom:1px solid #2b2d31;font-size:13px}
#tb-sidebar-preview .tb-brand{font-weight:600}
#tb-sidebar-preview .tb-logo{display:grid;place-items:center;width:22px;height:22px;background:#24323f;color:#a1ceff;border-radius:6px}
#tb-sidebar-preview .tb-version{font:11px Consolas,monospace;color:#9b9da2;background:#303236;padding:2px 5px;border-radius:4px}
#tb-sidebar-preview .tb-top-icons{display:flex;gap:18px;color:#a4a7ac;margin-left:8px}
#tb-sidebar-preview .tb-body{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:672px}
#tb-sidebar-preview .tb-sidebar{padding:20px 12px 14px;background:var(--tb-bg);border-right:1px solid #303236;display:flex;flex-direction:column;min-width:0}
#tb-sidebar-preview .tb-heading{display:flex;gap:8px;align-items:center;padding:0 8px;margin-bottom:18px}
#tb-sidebar-preview h2{margin:0;font-size:16px;line-height:24px;font-weight:600}
#tb-sidebar-preview .tb-total{font-size:12px;color:var(--tb-muted)}
#tb-sidebar-preview .tb-add{display:flex;gap:4px;align-items:center;margin-left:auto;background:transparent;border:0;padding:4px;font-size:11px;color:var(--tb-muted)}
#tb-sidebar-preview .tb-search{display:flex;gap:9px;align-items:center;height:36px;padding:0 10px;margin:0 5px 22px;border:1px solid #35373b;border-radius:8px;background:#27292c;color:#9b9da2}
#tb-sidebar-preview .tb-search:focus-within{border-color:var(--tb-accent)}
#tb-sidebar-preview input{min-width:0;width:100%;border:0;background:transparent;font-size:12px}
#tb-sidebar-preview input::placeholder{color:#9b9da2}
#tb-sidebar-preview .tb-section{min-height:32px;display:flex;gap:8px;align-items:center;padding:0 10px;margin-bottom:5px;font-size:12px;color:var(--tb-muted)}
#tb-sidebar-preview .tb-pinned{background:transparent;border:0;width:100%;text-align:left;margin-bottom:23px}
#tb-sidebar-preview .tb-section-count{margin-left:auto;font-size:11px;color:#92959b}
#tb-sidebar-preview .tb-project{margin-bottom:3px}
#tb-sidebar-preview .tb-project-row{display:flex;gap:10px;align-items:center;width:100%;min-height:var(--tb-row);padding:0 10px;border:0;border-radius:8px;background:transparent;text-align:left}
#tb-sidebar-preview .tb-project-row:hover,#tb-sidebar-preview .tb-child:hover{background:#292b2e}
#tb-sidebar-preview .tb-project-row[aria-expanded="true"]{background:#2b2d31}
#tb-sidebar-preview .tb-folder{color:#bfc3ca}
#tb-sidebar-preview .tb-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:400}
#tb-sidebar-preview .tb-count{color:#a5a8af;font-size:11px;font-variant-numeric:tabular-nums}
#tb-sidebar-preview .tb-arrow{width:12px;height:12px;color:#a0a3aa;transition:transform 150ms ease}
#tb-sidebar-preview [aria-expanded="true"]>.tb-arrow{transform:rotate(90deg)}
#tb-sidebar-preview .tb-children{margin:6px 0 9px 17px;padding-left:11px;border-left:1px solid #3a3c41}
#tb-sidebar-preview .tb-child{display:flex;gap:8px;align-items:center;min-height:34px;padding:0 9px;width:100%;text-align:left;border:0;border-radius:7px;background:transparent;font-size:12px;color:#aeb0b6}
#tb-sidebar-preview .tb-child .tb-count{margin-left:auto}
#tb-sidebar-preview .tb-child[aria-current="page"]{background:#2b3744;color:#e5edf7}
#tb-sidebar-preview .tb-session-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tb-sidebar-preview .tb-agent{margin-left:auto;font:10px "Segoe UI",sans-serif;color:#a7bdd6}
#tb-sidebar-preview .tb-mark{position:relative;display:flex;color:#bdd4f0}
#tb-sidebar-preview .tb-mark::after{content:"";position:absolute;right:-2px;bottom:-1px;width:4px;height:4px;background:#83c69c;border-radius:50%;box-shadow:0 0 0 2px #2b3744}
#tb-sidebar-preview .tb-empty{padding:12px 10px;font-size:12px;color:var(--tb-muted)}
#tb-sidebar-preview .tb-footer{margin-top:auto;padding:16px 10px 0;font-size:11px;color:#9b9da2}
#tb-sidebar-preview .tb-reference{position:relative;min-width:0;overflow:hidden;background:#1f1f1f}
#tb-sidebar-preview .tb-reference img{position:absolute;width:100%;height:100%;object-fit:cover;object-position:left top}
#tb-sidebar-preview .tb-status{display:flex;gap:8px;padding:4px 10px;border-top:1px solid #303236;background:#222426;color:#a5aab3;font-size:10px}
#tb-sidebar-preview .tb-status-path{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#tb-sidebar-preview [hidden]{display:none!important}
@media(max-width:600px){#tb-sidebar-preview .tb-body{grid-template-columns:minmax(0,1fr)}#tb-sidebar-preview .tb-reference,#tb-sidebar-preview .tb-top-icons{display:none}#tb-sidebar-preview .tb-sidebar{border-right:0}#tb-sidebar-preview .tb-version{margin-left:auto}}
@media(prefers-reduced-motion:reduce){#tb-sidebar-preview .tb-arrow{transition:none}}
</style>

<script>
(() => {
  const root = document.getElementById('tb-sidebar-preview');
  const list = root.querySelector('.tb-projects');
  const search = root.querySelector('input');
  const projects = [
    ['hongguoSign', ['签到服务']], ['hongguoTV', ['接口联调', '播放页面调整', '服务日志']],
    ['huluwa', []], ['openhongguo', ['项目终端', '项目会话']], ['sub2Api', []], ['TerminalBuddy', []]
  ];
  projects.forEach(([name, sessions], index) => {
    const project = document.createElement('section');
    project.className = 'tb-project';
    project.innerHTML = `<button class="tb-project-row" type="button" aria-expanded="false" aria-controls="tb-project-${index}"><i data-lucide="folder" class="tb-folder" aria-hidden="true"></i><span class="tb-name">${name}</span>${sessions.length ? `<span class="tb-count">${sessions.length}</span>` : ''}<i data-lucide="chevron-right" class="tb-arrow" aria-hidden="true"></i></button><div class="tb-children" id="tb-project-${index}" hidden>${sessions.length ? sessions.map(title => `<button class="tb-child" type="button" data-session="${title}"><i data-lucide="square-terminal" aria-hidden="true"></i><span class="tb-session-label">${title}</span></button>`).join('') : '<div class="tb-empty">暂无已打开的会话</div>'}</div>`;
    list.append(project);
  });
  if (globalThis.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
  const save = () => {
    if (window.openai && window.openai.setWidgetState) window.openai.setWidgetState({ modelContent: { design: '深色扁平项目侧栏' }, privateContent: { query: search.value, expanded: [...list.querySelectorAll('.tb-project-row[aria-expanded="true"]')].map(button => button.getAttribute('aria-controls')) } }).catch(() => {});
  };
  const filter = () => {
    const query = search.value.trim().toLocaleLowerCase();
    let count = 0;
    list.querySelectorAll('.tb-project').forEach(project => {
      const match = project.textContent.toLocaleLowerCase().includes(query);
      project.hidden = !match;
      if (match) count += 1;
      project.querySelectorAll('button[aria-controls]').forEach(button => {
        document.getElementById(button.getAttribute('aria-controls')).hidden = !(query ? match : button.getAttribute('aria-expanded') === 'true');
      });
    });
    root.querySelector('.tb-no-results').hidden = count > 0;
  };
  root.addEventListener('click', event => {
    const disclosure = event.target.closest('button[aria-controls]');
    if (disclosure && root.contains(disclosure)) {
      const expanded = disclosure.getAttribute('aria-expanded') !== 'true';
      disclosure.setAttribute('aria-expanded', String(expanded));
      document.getElementById(disclosure.getAttribute('aria-controls')).hidden = !expanded;
      save();
    }
    const session = event.target.closest('[data-session]');
    if (session && root.contains(session)) {
      root.querySelectorAll('[data-session][aria-current]').forEach(item => item.removeAttribute('aria-current'));
      session.setAttribute('aria-current', 'page');
      root.querySelector('.tb-live').textContent = `已选中：${session.dataset.session}`;
    }
  });
  search.addEventListener('input', () => { filter(); save(); });
  const restore = state => {
    if (!state || !state.privateContent) return;
    const stored = state.privateContent;
    if (typeof stored.query === 'string') search.value = stored.query;
    if (Array.isArray(stored.expanded)) list.querySelectorAll('.tb-project-row').forEach(button => button.setAttribute('aria-expanded', String(stored.expanded.includes(button.getAttribute('aria-controls')))));
    filter();
  };
  if (window.openai) restore(window.openai.widgetState);
  window.addEventListener('openai:set_globals', event => restore(event.detail && event.detail.globals && event.detail.globals.widgetState));
  const options = { rowHeight: 38, radius: 8, accent: '#7db4f2' };
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root.querySelector('.tb-sidebar'), onChange: () => {
      root.style.setProperty('--tb-row', `${options.rowHeight}px`);
      root.style.setProperty('--tb-accent', options.accent);
      root.querySelectorAll('.tb-project-row').forEach(row => row.style.borderRadius = `${options.radius}px`);
    } });
    tweak.addSlider(options, 'rowHeight', { label: '项目行高', min: 34, max: 46, step: 2, unit: 'px' });
    tweak.addSlider(options, 'radius', { label: '选中态圆角', min: 4, max: 12, step: 1, unit: 'px' });
    tweak.addColorPicker(options, 'accent', { label: '焦点强调色', reference: '--tb-accent' });
  }
})();
</script>
