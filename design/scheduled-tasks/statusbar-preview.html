<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TerminalBuddy · 状态栏定时任务入口预览</title>
<style>
  :root {
    color-scheme: dark;
    --bg-primary: #181a1d;
    --bg-secondary: #202226;
    --bg-tertiary: #2a2d31;
    --bg-elevated: #25282c;
    --text-primary: #e3e5e8;
    --text-secondary: #9aa0a8;
    --text-tertiary: #6f767f;
    --accent: #4b95e9;
    --accent-hover: #62a4ed;
    --accent-contrast: #fff;
    --border: #34383d;
    --border-subtle: #2b2f33;
    --danger: #ef6b73;
    --success: #55b988;
    --warning: #d9a441;
    --list-hover-bg: #292c30;
    --shadow-menu: 0 10px 30px rgba(0,0,0,.28);
    --shadow-popover: 0 -8px 28px rgba(0,0,0,.3);
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 8px;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg-primary: #f3f4f6;
    --bg-secondary: #fff;
    --bg-tertiary: #e9ebee;
    --bg-elevated: #fff;
    --text-primary: #24272c;
    --text-secondary: #626870;
    --text-tertiary: #8a9098;
    --accent: #176fbd;
    --accent-hover: #0d62aa;
    --border: #d6d9de;
    --border-subtle: #e4e6e9;
    --danger: #c9434d;
    --success: #23845b;
    --warning: #9a6b12;
    --list-hover-bg: #edf0f3;
    --shadow-menu: 0 10px 30px rgba(24,30,38,.16);
    --shadow-popover: 0 -8px 28px rgba(24,30,38,.18);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg-primary);
    background-image: radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--text-tertiary) 22%, transparent) 1px, transparent 0);
    background-size: 24px 24px;
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .icon { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .icon-sm { width: 14px; height: 14px; }
  .mono { font-family: var(--font-mono); }

  /* ---------- 预览工具条 ---------- */
  .preview-bar {
    position: sticky; top: 0; z-index: 80;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 12px 24px;
    background: color-mix(in srgb, var(--bg-primary) 84%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-subtle);
  }
  .preview-title { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-secondary); }
  .preview-title strong { font-size: 13px; color: var(--text-primary); font-weight: 600; }
  .preview-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 18%, transparent); }
  .preview-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 30px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg-tertiary); color: var(--text-primary);
    font-size: 12px; font-weight: 500; white-space: nowrap;
    transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
  }
  .btn:hover { background: var(--list-hover-bg); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-sm { height: 26px; padding: 0 9px; }
  .btn-icon { width: 24px; height: 24px; padding: 0; background: transparent; border-color: transparent; color: var(--text-secondary); }
  .btn-icon:hover { background: var(--bg-tertiary); color: var(--text-primary); }
  .btn-icon .icon { width: 13px; height: 13px; }

  /* ---------- 应用窗口 ---------- */
  .stage { min-height: calc(100vh - 55px); display: flex; align-items: center; justify-content: center; padding: 28px 24px 40px; }
  .app-window {
    width: min(1180px, calc(100vw - 48px));
    height: min(680px, calc(100vh - 140px));
    min-height: 460px;
    display: flex; flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-secondary);
    box-shadow: 0 26px 70px rgba(0,0,0,.42);
    overflow: visible;
    position: relative;
  }
  .window-titlebar {
    flex: 0 0 38px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px 0 16px; border-bottom: 1px solid var(--border-subtle);
    background: var(--bg-secondary); border-radius: 10px 10px 0 0;
  }
  .window-title { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); }
  .window-title .icon { color: var(--accent); }
  .window-controls { display: flex; gap: 6px; }
  .window-control { width: 10px; height: 10px; border-radius: 50%; background: var(--text-tertiary); opacity: .45; }

  .app-content {
    flex: 1; min-height: 0; position: relative; overflow: hidden;
    background:
      linear-gradient(180deg, color-mix(in srgb, var(--bg-primary) 60%, transparent), transparent 30%),
      var(--bg-secondary);
  }
  .app-content::before {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(var(--border-subtle) 1px, transparent 1px), linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
    background-size: 40px 40px; opacity: .18;
  }
  .content-hint {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    color: var(--text-tertiary); font-size: 12px; text-align: center;
  }
  .content-hint .ghost-terminal {
    width: min(520px, 70%); height: 120px; margin-bottom: 6px;
    border: 1px dashed color-mix(in srgb, var(--border) 75%, transparent);
    border-radius: 8px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--bg-primary) 35%, transparent);
    font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary);
  }
  .content-hint strong { color: var(--text-secondary); font-weight: 500; }

  /* ---------- 状态栏 ---------- */
  .statusbar {
    flex: 0 0 24px; height: 24px;
    display: flex; align-items: stretch;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    font-size: 11px; line-height: 1; user-select: none;
    border-radius: 0 0 10px 10px;
    overflow: visible;
    position: relative;
    z-index: 3;
  }
  .sb-left, .sb-right { display: flex; align-items: stretch; min-width: 0; }
  .sb-right { margin-left: auto; }
  .sb-item {
    appearance: none; display: inline-flex; align-items: center; gap: 5px;
    min-width: 0; padding: 0 8px; border: 0; background: transparent;
    color: inherit; font: inherit; white-space: nowrap; cursor: default;
    transition: background-color 100ms ease, color 100ms ease;
  }
  .sb-clickable { cursor: pointer; }
  .sb-item:hover { background: var(--list-hover-bg); color: var(--text-primary); }
  .sb-item.active { background: var(--bg-tertiary); color: var(--text-primary); }
  .sb-icon { width: 12px; height: 12px; flex: none; stroke-width: 1.7; }
  .sb-divider { width: 1px; margin-block: 6px; background: var(--border-subtle); flex: none; }
  .sb-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 2px color-mix(in srgb, var(--success) 18%, transparent); flex: none; }
  .sb-dot.idle { background: var(--text-tertiary); box-shadow: none; }
  .sb-dot.running { background: var(--accent); box-shadow: none; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.35; transform:scale(.8); } 50% { opacity:1; transform:scale(1); } }
  .sb-badge {
    flex: none; padding: 1px 4px; border-radius: 3px;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--accent); font-size: 9px; font-weight: 600; line-height: 1.2;
  }
  .sb-muted { color: var(--text-tertiary); }
  .sb-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 入口：相对定位，浮层绝对定位到上方 */
  .scheduled-entry { position: relative; display: flex; align-items: stretch; }
  .scheduled-entry .sb-item { position: relative; }
  .scheduled-entry .sb-item::after {
    content: ""; position: absolute; left: 6px; right: 6px; bottom: 0; height: 1.5px;
    background: var(--accent); border-radius: 1px 1px 0 0;
    opacity: 0; transition: opacity 140ms ease;
  }
  .scheduled-entry.open .sb-item::after { opacity: 1; }
  .scheduled-entry.open .sb-item { background: var(--bg-tertiary); color: var(--text-primary); }
  .entry-warn { width: 5px; height: 5px; border-radius: 50%; background: var(--warning); flex: none; }

  /* ---------- 浮层 ---------- */
  .scheduled-popover {
    position: absolute;
    right: 0; bottom: calc(100% + 6px);
    z-index: 30;
    width: 360px;
    max-height: min(460px, calc(100vh - 120px));
    display: flex; flex-direction: column;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow-popover);
    overflow: hidden;
    transform-origin: bottom right;
    animation: popover-in .18s cubic-bezier(.16,1,.3,1) both;
  }
  .scheduled-popover[hidden] { display: none; }
  @keyframes popover-in { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }

  .popover-header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 7px;
    padding: 8px 8px 8px 11px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .popover-title-icon { width: 14px; height: 14px; color: var(--accent); }
  .popover-title { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .popover-sub { font-size: 11px; color: var(--text-tertiary); white-space: nowrap; }
  .popover-header-spacer { flex: 1; min-width: 0; }
  .popover-body { flex: 1; min-height: 0; overflow-y: auto; padding: 6px; }
  .popover-body::-webkit-scrollbar { width: 5px; }
  .popover-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .popover-section-label {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 6px 4px;
    color: var(--text-tertiary); font-size: 10px; font-weight: 650;
    letter-spacing: .06em; text-transform: uppercase;
  }
  .popover-section-label::after { content: ""; flex: 1; height: 1px; background: var(--border-subtle); }

  .task-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 8px; border-radius: 6px;
    cursor: pointer;
    transition: background-color 120ms ease;
  }
  .task-row:hover { background: var(--list-hover-bg); }
  .task-row + .task-row { margin-top: 1px; }
  .task-status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); flex: none; }
  .task-status-dot.running { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
  .task-status-dot.waiting { background: var(--warning); }
  .task-status-dot.idle { background: var(--text-tertiary); }
  .task-row-main { flex: 1; min-width: 0; }
  .task-row-title { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .task-row-name { font-size: 12px; font-weight: 550; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-row-meta { margin-top: 3px; font-size: 11px; color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-row-time { flex: none; font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); white-space: nowrap; }
  .task-row-time.accent { color: var(--accent); }
  .task-row-actions { display: flex; gap: 1px; flex: none; }
  .row-icon-btn {
    width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
    border: 0; border-radius: 4px; background: transparent; color: var(--text-secondary);
  }
  .row-icon-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
  .row-icon-btn.danger:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .row-icon-btn .icon { width: 12px; height: 12px; }

  .running-row { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .running-row:hover { background: color-mix(in srgb, var(--accent) 11%, transparent); }
  .running-elapsed { font-family: var(--font-mono); font-size: 11px; color: var(--accent); white-space: nowrap; }
  .stop-btn {
    height: 22px; padding: 0 8px; display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid color-mix(in srgb, var(--danger) 34%, var(--border));
    border-radius: 4px; background: transparent; color: var(--danger);
    font-size: 11px;
  }
  .stop-btn:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .stop-btn .icon { width: 10px; height: 10px; }

  .popover-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 30px 16px 26px; text-align: center;
  }
  .popover-empty-icon {
    width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 10px;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 26%, var(--border));
  }
  .popover-empty-icon .icon { width: 21px; height: 21px; stroke-width: 1.5; }
  .popover-empty-title { font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
  .popover-empty-desc { font-size: 11.5px; color: var(--text-tertiary); line-height: 1.55; margin-bottom: 12px; }

  .popover-footer {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 8px; border-top: 1px solid var(--border-subtle);
    background: var(--bg-elevated);
  }
  .manage-btn {
    flex: 1; height: 28px; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg-tertiary); color: var(--text-primary); font-size: 11.5px;
  }
  .manage-btn:hover { background: var(--list-hover-bg); }
  .manage-btn .icon { width: 12px; height: 12px; }
  .new-btn {
    height: 28px; padding: 0 9px; display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--accent); border-radius: var(--radius-sm);
    background: var(--accent); color: var(--accent-contrast); font-size: 11.5px;
  }
  .new-btn:hover { background: var(--accent-hover); }
  .new-btn .icon { width: 12px; height: 12px; }

  .popover-error {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 9px; margin: 4px 4px 0;
    border: 1px solid color-mix(in srgb, var(--danger) 28%, var(--border));
    background: color-mix(in srgb, var(--danger) 8%, transparent);
    border-radius: var(--radius-sm); font-size: 11px; color: var(--text-secondary);
  }
  .popover-error .icon { color: var(--danger); }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; right: 24px; bottom: 24px; z-index: 200;
    display: flex; align-items: center; gap: 8px;
    min-width: 200px; max-width: 360px; padding: 10px 14px;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: var(--radius-md); box-shadow: var(--shadow-menu);
    font-size: 12.5px; opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity 180ms ease, transform 180ms ease;
  }
  .toast.show { opacity: 1; transform: none; }
  .toast .icon { color: var(--success); }

  @media (max-width: 820px) {
    .preview-title span:last-child { display: none; }
    .sb-hide-narrow { display: none; }
    .scheduled-popover { width: min(360px, calc(100vw - 24px)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>

<div class="preview-bar">
  <div class="preview-title">
    <span class="preview-dot"></span>
    <strong>TerminalBuddy · 状态栏快捷入口</strong>
    <span>定时任务 / 静态交互预览</span>
  </div>
  <div class="preview-actions">
    <button class="btn btn-sm" id="themeToggle"><svg class="icon icon-sm"><use href="#i-palette"/></svg><span>浅色主题</span></button>
    <button class="btn btn-sm" data-state="default">有任务</button>
    <button class="btn btn-sm" data-state="running">运行中</button>
    <button class="btn btn-sm" data-state="empty">空状态</button>
    <button class="btn btn-sm btn-primary" id="openPage"><svg class="icon icon-sm"><use href="#i-calendar"/></svg>打开管理</button>
  </div>
</div>

<main class="stage">
  <div class="app-window">
    <div class="window-titlebar">
      <div class="window-title"><svg class="icon icon-sm"><use href="#i-folder"/></svg>TerminalBuddy — 项目开发</div>
      <div class="window-controls"><span class="window-control"></span><span class="window-control"></span><span class="window-control"></span></div>
    </div>

    <div class="app-content">
      <div class="content-hint">
        <div class="ghost-terminal">应用内容区域 · 终端 / 聊天 / 编辑器</div>
        <strong>底部状态栏右侧新增「定时」快捷入口</strong>
        <span>点击入口直接打开定时任务管理页面（独立工作区标签页）</span>
      </div>
    </div>

    <div class="statusbar" role="group" aria-label="应用状态栏">
      <div class="sb-left">
        <span class="sb-item" title="当前没有活动的终端会话">
          <span class="sb-dot idle" aria-hidden="true"></span>
          <span>无活动会话</span>
        </span>
        <span class="sb-divider" aria-hidden="true"></span>
        <button class="sb-item sb-clickable" title="打开文件管理 · C:\code\terminal-buddy">
          <svg class="sb-icon"><use href="#i-folder"/></svg>
          <span class="sb-label">C:\code\terminal-buddy</span>
        </button>
        <span class="sb-item sb-hide-narrow" title="当前分支 master · 2 个变更">
          <svg class="sb-icon"><use href="#i-branch"/></svg>
          <span class="mono">master</span>
          <span class="sb-badge">2</span>
        </span>
      </div>

      <div class="sb-right">
        <span class="sb-item sb-hide-narrow" title="Web 服务已启用 · 端口 9600">
          <svg class="sb-icon"><use href="#i-globe"/></svg>
          <span>Web</span><span class="mono">:9600</span><span class="sb-dot" aria-hidden="true"></span>
        </span>

        <div class="scheduled-entry" id="scheduledEntry">
          <button
            class="sb-item sb-clickable"
            id="scheduledButton"
            type="button"
            aria-label="打开定时任务管理页面"
            title="定时任务 · 3 个启用 · 下次今天 18:00 · 点击打开管理"
          >
            <svg class="sb-icon"><use href="#i-calendar"/></svg>
            <span class="sb-dot running" id="entryDot" aria-hidden="true" hidden></span>
            <span class="sb-label" id="entryLabel">定时</span>
            <span class="sb-badge" id="entryBadge">3</span>
            <span class="mono" id="entryTime">18:00</span>
          </button>
        </div>

        <span class="sb-item sb-hide-narrow" title="CPU 使用率 18%">
          <svg class="sb-icon"><use href="#i-cpu"/></svg><span class="mono">18%</span>
        </span>
        <span class="sb-item sb-hide-narrow" title="内存 42%">
          <svg class="sb-icon"><use href="#i-memory"/></svg><span class="mono">42%</span>
        </span>
        <span class="sb-item" title="本地时间"><svg class="sb-icon"><use href="#i-clock"/></svg><span class="mono">14:32</span></span>
        <span class="sb-item"><span class="mono">v1.9.0</span></span>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"><svg class="icon"><use href="#i-check"/></svg><span id="toastText">操作完成</span></div>

<script>
  const $ = selector => document.querySelector(selector);
  const $$ = selector => Array.from(document.querySelectorAll(selector));

  /* 主题 */
  const themeToggle = $('#themeToggle');
  themeToggle.addEventListener('click', () => {
    const light = document.documentElement.getAttribute('data-theme') === 'light';
    document.documentElement.setAttribute('data-theme', light ? 'dark' : 'light');
    themeToggle.querySelector('span').textContent = light ? '浅色主题' : '深色主题';
  });

  /* Toast */
  let toastTimer;
  function toast(message) {
    const el = $('#toast');
    $('#toastText').textContent = message;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  /* 入口：直接打开管理页面 */
  const button = $('#scheduledButton');
  function openManagement() {
    button.classList.add('active');
    toast('打开定时任务管理页面');
    setTimeout(() => button.classList.remove('active'), 1400);
  }
  button.addEventListener('click', openManagement);
  $('#openPage').addEventListener('click', openManagement);

  /* 状态切换 */
  function applyState(state, options = {}) {
    const dot = $('#entryDot');
    const label = $('#entryLabel');
    const badge = $('#entryBadge');
    const time = $('#entryTime');

    if (state === 'empty') {
      dot.hidden = true;
      label.textContent = '定时';
      badge.hidden = true;
      time.hidden = true;
      button.title = '暂无定时任务 · 点击打开管理页面';
    } else if (state === 'running') {
      dot.hidden = false;
      dot.className = 'sb-dot running';
      label.textContent = '运行中';
      badge.hidden = false;
      badge.textContent = '1';
      time.hidden = true;
      button.title = '定时任务 · 1 个正在运行 · 点击打开管理页面';
    } else {
      dot.hidden = true;
      label.textContent = '定时';
      badge.hidden = false;
      badge.textContent = '3';
      time.hidden = false;
      time.textContent = '18:00';
      button.title = '定时任务 · 3 个启用 · 下次今天 18:00 · 点击打开管理页面';
    }

    if (!options.silent) toast(`已切换到「${state === 'empty' ? '空状态' : state === 'running' ? '运行中' : '有任务'}」`);
  }

  $$('[data-state]').forEach(el => el.addEventListener('click', () => applyState(el.dataset.state)));

  applyState('default', { silent: true });

  if (location.hash === '#running') applyState('running', { silent: true });
  if (location.hash === '#empty') applyState('empty', { silent: true });
</script>
</body>
</html>
