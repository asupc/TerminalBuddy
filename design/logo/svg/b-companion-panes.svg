<!-- 方案 B「双窗结伴 Companion Panes」
     两张层叠终端卡片：后窗（天青）是同伴，前窗（石板）是终端 >_ 。
     既是 buddy 结伴，也对应应用管理多会话/标签的能力。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C2434"/>
      <stop offset="1" stop-color="#0D121B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#b-bg)"/>
  <!-- 后窗：同伴 -->
  <rect x="106" y="126" width="250" height="190" rx="40" fill="#38BDF8"/>
  <!-- 前窗：终端 -->
  <rect x="156" y="186" width="250" height="190" rx="40" fill="#273244"/>
  <!-- 提示符 >_ -->
  <path d="M222 253 L258 285 L222 317" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="278" y="302" width="72" height="18" rx="9" fill="#FFFFFF"/>
</svg>
