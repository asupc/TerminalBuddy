<!-- 方案 A「提示符笑脸 Prompt Buddy」
     旧版的 > _ · 三个提示符元素重排为颜文字 ^_^：
     双眼是两个提示符折角，嘴巴是下划线，右侧黄点是闪烁光标。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#FF5E57"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#a-bg)"/>
  <!-- 双眼：^ ^ 闭眼笑 -->
  <path d="M132 246 L176 202 L220 246" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M292 246 L336 202 L380 246" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 嘴：下划线 _ -->
  <rect x="166" y="300" width="180" height="36" rx="18" fill="#FFFFFF"/>
  <!-- 光标点 -->
  <circle cx="396" cy="318" r="22" fill="#FFE66D"/>
</svg>
