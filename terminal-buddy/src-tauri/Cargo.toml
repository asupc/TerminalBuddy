[package]
name = "terminal-buddy"
version = "1.7.0"
description = "TerminalBuddy - 终端配置管理工具"
authors = [""]
edition = "2021"
default-run = "terminal-buddy"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-single-instance", "dep:tauri-winrt-notification", "dep:clipboard-win", "dep:windows-registry", "dep:webview2-com"]
server = ["dep:aes-gcm"]

[[bin]]
name = "terminal-buddy"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "terminal-buddy-server"
path = "src/server_main.rs"
required-features = ["server"]

[lib]
name = "terminal_buddy_lib"
crate-type = ["rlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
semver = "1"
toml_edit = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "macros", "sync", "time", "net", "signal", "fs"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
portable-pty = "0.9"
aes-gcm = { version = "0.10", optional = true }
reqwest = { version = "0.12", features = ["json", "multipart"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "timeout"] }
hyper-util = { version = "0.1", features = [
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
tokio-tungstenite = "0.26"
jsonwebtoken = "9"
bcrypt = "0.17"
futures-util = "0.3"
include_dir = "0.7"
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
urlencoding = "2"
ssh2 = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
lark-channel = { version = "0.4", features = ["websocket"] }
shell-words = "1.1"
zip = "2"

# WebView2 原生设置（关闭浏览器加速键），版本与 tauri 依赖树中的 webview2-com-sys 对齐
[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.38", optional = true }
tauri-winrt-notification = { version = "0.7.3", optional = true }
windows-registry = { version = "0.6", optional = true }
clipboard-win = { version = "5.4.1", features = ["std"], optional = true }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem"] }

[patch.crates-io]
portable-pty = { path = "portable-pty-patched" }

[profile.dev]
opt-level = 1
incremental = true

[profile.release]
panic = "abort"
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
