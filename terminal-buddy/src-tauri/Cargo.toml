[package]
name = "terminal-buddy"
version = "1.9.0"
description = "TerminalBuddy - 终端配置管理工具"
authors = [""]
edition = "2021"
default-run = "terminal-buddy"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-single-instance", "dep:tauri-winrt-notification", "dep:clipboard-win", "dep:windows-registry", "dep:webview2-com", "dep:png"]
server = ["dep:aes-gcm"]

[[bin]]
name = "terminal-buddy"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "terminal-buddy-server"
path = "src/server_main.rs"
required-features = ["server"]

[lib]
name = "terminal_buddy_lib"
# 桌面端与服务端都只通过 bin 链接 rlib；cdylib 仅移动端 Tauri 需要，
# 保留它会让每次 release 构建多链接一个 ~1.9 MB 的 DLL（ThinLTO 全量重跑）。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
semver = "1"
toml_edit = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "macros", "sync", "time", "net", "signal", "fs"] }
# 浏览器端文件下载：把 tokio 文件句柄转成响应体流，避免整文件读进内存。
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
portable-pty = "0.9"
aes-gcm = { version = "0.10", optional = true }
# stream：远程工作区代理需要 Response::bytes_stream 与 Body::wrap_stream 做流式转发/上传下载。
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "timeout"] }
hyper-util = { version = "0.1", features = [
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
tokio-tungstenite = "0.29"
jsonwebtoken = "9"
bcrypt = "0.17"
futures-util = "0.3"
encoding_rs = "0.8"
hex = "0.4"
rand = "0.9"
rusqlite = { version = "0.42", default-features = false, features = ["bundled", "cache"] }
base64 = "0.22"
urlencoding = "2"
ssh2 = "0.9"
shell-words = "1.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
cron = "0.15"
chrono-tz = "0.10"

# WebView2 原生设置（关闭浏览器加速键），版本与 tauri 依赖树中的 webview2-com-sys 对齐
[target.'cfg(windows)'.dependencies]
png = { version = "0.18", optional = true }
webview2-com = { version = "0.39", optional = true }
tauri-winrt-notification = { version = "0.7.3", optional = true }
windows-registry = { version = "0.6", optional = true }
clipboard-win = { version = "5.4.1", features = ["std"], optional = true }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem"] }

[target.'cfg(not(windows))'.dependencies]
aes-gcm = "0.10"

[patch.crates-io]
portable-pty = { path = "portable-pty-patched" }

[profile.dev]
opt-level = 1
incremental = true
# 默认 debug = 2 会让 target/ 膨胀到十几 GB，链接/PDB 写入占掉大量增量构建时间。
# 只保留行号表即可满足日常调试，体积和链接耗时都显著下降。
debug = 1

[profile.release]
panic = "abort"
# ThinLTO 下 codegen-units 越大并行度越高：4 → 16 可明显缩短 release 链接时间，
# 体积通常只增加 1% 左右（已实测对比，见提交说明）。
codegen-units = 16
lto = "thin"
opt-level = "z"
strip = true

[profile.release.build-override]
# 加速 proc-macro（tauri-codegen 的 Brotli q9 前端压缩默认在 opt-level=0 下执行）
opt-level = 2
